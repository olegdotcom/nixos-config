general {
  # Start hyprlock only if no lock-screen process is already running.
  lock_cmd = nu --no-config-file -c 'if (pidof hyprlock | complete).exit_code != 0 { hyprlock }'
  # Every system sleep request sends a lock signal, which runs lock_cmd above.
  before_sleep_cmd = loginctl lock-session
  # Wait for the compositor to confirm the session is locked before sleeping.
  inhibit_sleep = 3
  # Turn displays back on when the system resumes from sleep.
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
  # Lock after five minutes without input, on either battery or external power.
  timeout = 300
  # Send the same lock signal used by the manual lock shortcut.
  on-timeout = loginctl lock-session
}

listener {
  # At the same five-minute threshold, switch off the displays to save power.
  timeout = 300
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
  # Wake the displays when keyboard or pointer activity returns.
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
  # Consider system sleep after ten minutes without input.
  timeout = 600
  # Run only if systemd explicitly reports no external power; errors block sleep.
  # This condition is checked when the idle timeout fires.
  condition_cmd = nu --no-config-file -c 'if ((systemd-ac-power --verbose | complete).stdout | str trim) == "no" { exit 0 }; exit 1'
  # Follow logind's SleepOperation and the hibernation delay in configuration.nix.
  on-timeout = systemctl sleep
}
