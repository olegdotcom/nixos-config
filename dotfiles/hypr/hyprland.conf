# See https://wiki.hyprland.org/Configuring/Keywords/

# Applications
$terminal = foot
$browser = chromium
$launcher = anyrun

# Keep both HiDPI displays at their preferred mode and 2x scaling.
# Match the ASUS by description so moving the cable to another port still works.
monitor = eDP-1,preferred,auto,2
monitor = desc:ASUSTek COMPUTER INC PA32QCV TALMSV000428,preferred,auto,2
monitor = ,preferred,auto,2

# Autostart
exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper
exec-once = nm-applet
exec-once = pypr

# Reapply the built-in monitor rules when opening the lid after undocking.
# Pyprland 3.4.6 does not directly relayout on monitor removal.
bindl = , switch:off:Lid Switch, exec, pypr relayout

# Input settings
input {
		kb_layout = us
		kb_rules = evdev
		kb_model = pc105
		follow_mouse = 1

		touchpad {
				natural_scroll = false
				scroll_factor = 0.2
				clickfinger_behavior = true
				tap-to-click = false
		}
}

# Three-finger Back/Forward navigation on both trackpads.
gesture = 3, left, dispatcher, sendshortcut, ALT, Left, activewindow
gesture = 3, right, dispatcher, sendshortcut, ALT, Right, activewindow

# General settings
general {
		gaps_in = 5
		gaps_out = 10
		border_size = 2
		col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
		col.inactive_border = rgba(595959aa)
		layout = dwindle
}

# Decoration
decoration {
		rounding = 5
}

# Misc settings
misc {
		# Variable refresh rate: 0 = off, 1 = fullscreen, 2 = always
    vrr = 2
}

# Animations
animations {
		enabled = yes
		bezier = myBezier, 0.05, 0.9, 0.1, 1.05
		animation = windows, 1, 7, myBezier
		animation = border, 1, 10, default
		animation = fade, 1, 7, default
		animation = workspaces, 1, 6, default
}

# Keybindings
# See https://wiki.hyprland.org/Configuring/Binds/
$mainMod = ALT

# Launchers
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, $launcher

# Window management
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, systemctl suspend
bind = $mainMod, P, exec, hyprshot -m region -o ~/screenshots
# Recover the panel if the ASUS was unplugged while the lid was already open.
bindl = $mainMod SHIFT, M, exec, pypr relayout

# Volume and brightness
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow 
